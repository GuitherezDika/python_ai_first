buildscript {
    ext.kotlin_version = '1.8.0' // Versi Kotlin yang direkomendasikan untuk AGP 8.1.0
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Ini adalah Android Gradle Plugin (AGP) yang menangani proses build Android
        classpath 'com.android.tools.build:gradle:8.1.0' 
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// ... existing code ...

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}